# Settings that only apply to the dongle build.

# 128x32 SSD1306 OLED (per side battery + active layer). The rest of the
# display configuration lives in boards/shields/sofle_dongle/Kconfig.defconfig.
CONFIG_ZMK_DISPLAY=y

# Needed for the per side battery readout: without it the central never learns
# the battery levels of the two halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The dongle is USB powered, so keep the screen on rather than blanking it
# after CONFIG_ZMK_IDLE_TIMEOUT. Set to y to save the OLED from burn in.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
